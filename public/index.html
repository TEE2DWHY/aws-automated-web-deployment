<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script
			src="https://cdn.jsdelivr.net/npm/axios@1.21.1/dist/axios.min.js"
			defer
		></script>
		<script src="./js/upload.js" defer></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=upload_file"
		/>
		<title>Upload File</title>

		<style>
			body {
				font-family: 'Google Sans', sans-serif;
			}
			.material-symbols-outlined {
				font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
			}
		</style>
	</head>
	<body>
		<div
			class="bg-gray-100 min-h-screen flex flex-col p-5 sm:p-8 text-slate-900"
		>
			<header class="flex gap-2 items-center">
				<span class="material-symbols-outlined text-blue-700" aria-hidden="true"
					>upload_file</span
				>
				<p class="font-bold text-xl">File upload</p>
			</header>

			<main class="flex flex-1 justify-center items-center py-12">
				<div class="flex flex-col gap-3 justify-center items-center w-full">
					<h1 class="text-4xl sm:text-5xl font-bold text-center">
						Upload a file
					</h1>
					<p class="text-gray-500 text-center">
						Choose a file to get started (up to 5 MiB)
					</p>

					<div
						class="bg-white w-full max-w-[600px] rounded-3xl border border-gray-200 shadow-sm p-6 sm:p-10 mt-5 flex flex-col items-center gap-5"
					>
						<span
							class="material-symbols-outlined text-blue-700 !text-6xl"
							aria-hidden="true"
							>upload_file</span
						>
						<h2 class="font-bold text-2xl text-center">Choose your file</h2>
						<label
							class="relative text-blue-700 border-2 border-blue-600 rounded-xl px-6 py-3 font-semibold hover:bg-blue-50 focus-within:outline-2 focus-within:outline-offset-4 focus-within:outline-blue-600 cursor-pointer"
							id="customUploadBtn"
							for="fileInput"
						>
							Choose file
							<input
								type="file"
								id="fileInput"
								aria-label="Choose a file to upload"
								class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
								name="upload_file"
							/>
						</label>

						<div id="selectedFile" class="w-full" hidden>
							<div class="bg-gray-100 rounded-xl p-4 flex gap-3 items-center">
								<span
									class="material-symbols-outlined text-gray-500"
									aria-hidden="true"
									>upload_file</span
								>
								<div class="flex-1 min-w-0">
									<p id="fileName" class="font-semibold break-all"></p>
									<p id="fileSize" class="text-sm text-gray-500 mt-1"></p>
								</div>
								<button
									id="removeFileBtn"
									type="button"
									aria-label="Remove selected file"
									class="text-gray-500 text-2xl rounded-md px-2 hover:bg-gray-200 focus-visible:outline-2 focus-visible:outline-blue-600 cursor-pointer"
								>
									&times;
								</button>
							</div>
						</div>

						<!-- JavaScript enables upload after a valid file is selected. -->
						<button
							id="uploadBtn"
							type="button"
							disabled
							class="w-full bg-blue-700 text-white rounded-xl py-3 font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
						>
							Upload file
						</button>
						<p
							id="uploadStatus"
							role="status"
							aria-live="polite"
							class="text-gray-500 text-sm text-center"
						>
							No file selected
						</p>
					</div>
				</div>
			</main>

			<footer class="text-gray-500 text-sm text-center pb-2">
				AWS deployment project
			</footer>
		</div>
	</body>
</html>
